<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Detection YOLOv8</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 0; }
    .container { max-width: 980px; margin: 30px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; color: #1f2937; }
    .form-group { margin: 16px 0; }
    input[type="file"] { padding: 8px; }
    button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .flash { margin: 12px 0; color: #b91c1c; }
    .result-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #f9fafb; border-radius: 10px; padding: 12px; border: 1px solid #e5e7eb; }
    .card h3 { margin-top: 0; }
    img { width: 100%; border-radius: 8px; border: 1px solid #d1d5db; }
    .hint { color: #4b5563; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>YOLOv8 人脸检测系统</h1>
    <p class="hint">上传一张图片，点击“开始检测”，系统会输出带有人脸框的结果图。</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" enctype="multipart/form-data">
      <div class="form-group">
        <input type="file" name="image" accept=".jpg,.jpeg,.png" required />
      </div>
      <button type="submit">开始检测</button>
    </form>

    {% if original_image and result_image %}
    <div class="result-wrapper">
      <div class="card">
        <h3>原始图片</h3>
        <img src="{{ original_image }}" alt="原始上传图片" />
      </div>
      <div class="card">
        <h3>检测结果</h3>
        <img src="{{ result_image }}" alt="检测结果图片" />
      </div>
    </div>
    {% endif %}
  </div>
</body>
</html>
